<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AS Invitation</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="page">

    <section
      class="invitation-stage"
      id="invitationStage"
    >

      <!-- =========================================
           ORIGINAL INVITATION
      ========================================== -->

      <div class="invitation">

        <img
          src="./A6-2.png"
          class="invitation-image"
          alt=""
          draggable="false"
        >

      </div>


      <!-- =========================================
           FROSTED PAPER SYSTEM
      ========================================== -->

      <div class="glass-system">


        <!-- =====================================
             LEFT PANEL
        ====================================== -->

        <div class="glass-door glass-left">

          <!-- Blurred copy of invitation -->
          <div class="blurred-invitation"></div>

          <!-- Soft paper veil -->
          <div class="glass-tint"></div>

          <!-- Very subtle paper texture -->
          <div class="glass-pattern"></div>

          <!-- No strong glass shine -->
          <div class="glass-shine"></div>

          <!-- Elegant inner border -->
          <div class="glass-frame"></div>

        </div>


        <!-- =====================================
             RIGHT PANEL
        ====================================== -->

        <div class="glass-door glass-right">

          <!-- Blurred copy of invitation -->
          <div class="blurred-invitation"></div>

          <!-- Soft paper veil -->
          <div class="glass-tint"></div>

          <!-- Very subtle paper texture -->
          <div class="glass-pattern"></div>

          <!-- No strong glass shine -->
          <div class="glass-shine"></div>

          <!-- Elegant inner border -->
          <div class="glass-frame"></div>

        </div>


        <!-- =====================================
             EMBOSSED MONOGRAM
        ====================================== -->

        <button
          class="monogram"
          id="openButton"
          type="button"
          aria-label="فتح الدعوة"
        >

          <!-- Soft shadow underneath -->
          <span class="mono-shadow"></span>

          <!-- Embossed seal -->
          <span class="mono-disc">

            <!-- Outer engraved ring -->
            <span class="mono-ring outer"></span>

            <!-- Inner engraved ring -->
            <span class="mono-ring inner"></span>

            <!-- Monogram -->
            <span class="mono-letter a">A</span>
            <span class="mono-letter s">S</span>

            <!-- Small embossed highlight -->
            <span class="mono-highlight"></span>

          </span>

        </button>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
